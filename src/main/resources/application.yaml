server:
  port: 8888

spring:
  application:
    name: config-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:git}

  cloud:
    config:
      server:
        git:
          uri: ${SPRING_CLOUD_CONFIG_SERVER_GIT_URI:https://github.com/SWE-PictureDictionary/swe-config-repo}
          default-label: ${SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL:main}
          clone-on-start: true